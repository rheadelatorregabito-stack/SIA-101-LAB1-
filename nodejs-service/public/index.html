<!DOCTYPE html>
<html lang="en">
<head><link rel="stylesheet" href="style.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stitch & Friends Sky Blue Calculator</title>
</head>
<body>

    <div id="sticker-container"></div>

    <div class="calculator">
        <div class="display">
            <div class="display-topbar">
                <button class="history-btn" onclick="toggleHistory()" title="Calculation History">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="12" cy="12" r="10"></circle>
                        <polyline points="12 6 12 12 8 14"></polyline>
                    </svg>
                </button>
                <div class="expression" id="expression"></div>
            </div>
            <div class="result" id="result">0</div>
        </div>

        <div class="keypad">
            <button class="btn btn-clear" onclick="clearAll()">AC</button>
            <button class="btn btn-del" onclick="deleteLast()">DEL</button>
            <button class="btn btn-op" aria-label="Modulo" title="Modulo" onclick="handleOp('modulo')">MOD</button>
            <button class="btn btn-op" onclick="handleOp('divide')">÷</button>

            <button class="btn btn-op" onclick="handleOp('power')">xʸ</button>
            <button class="btn btn-op" onclick="handleOp('square_root')">√</button>
            <button class="btn btn-op" onclick="toggleSign()">+/-</button>
            <button class="btn btn-op" onclick="handleOp('multiply')">×</button>

            <button class="btn" onclick="appendNum('7')">7</button>
            <button class="btn" onclick="appendNum('8')">8</button>
            <button class="btn" onclick="appendNum('9')">9</button>
            <button class="btn btn-op" onclick="handleOp('subtract')">-</button>

            <button class="btn" onclick="appendNum('4')">4</button>
            <button class="btn" onclick="appendNum('5')">5</button>
            <button class="btn" onclick="appendNum('6')">6</button>
            <button class="btn btn-op" onclick="handleOp('add')">+</button>

            <button class="btn" onclick="appendNum('1')">1</button>
            <button class="btn" onclick="appendNum('2')">2</button>
            <button class="btn" onclick="appendNum('3')">3</button>
            <button class="btn btn-equals" onclick="handleEquals()">=</button>

            <button class="btn btn-zero" onclick="appendNum('0')">0</button>
            <button class="btn" onclick="appendNum('.')">.</button>

            <svg class="stitch-sticker" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
                <path d="M 25 35 C 5 15, -5 30, 20 48 Z" fill="#0284c7" stroke="#38bdf8" stroke-width="2"/>
                <path d="M 22 36 C 10 22, 2 32, 18 45 Z" fill="#f43f5e" opacity="0.7"/>
                <path d="M 75 35 C 95 15, 105 30, 80 48 Z" fill="#0284c7" stroke="#38bdf8" stroke-width="2"/>
                <path d="M 78 36 C 90 22, 98 32, 82 45 Z" fill="#f43f5e" opacity="0.7"/>
                <ellipse cx="50" cy="50" rx="30" ry="24" fill="#0284c7" stroke="#38bdf8" stroke-width="2"/>
                <ellipse cx="38" cy="48" rx="9" ry="11" fill="#bae6fd"/>
                <ellipse cx="62" cy="48" rx="9" ry="11" fill="#bae6fd"/>
                <ellipse cx="40" cy="48" rx="5" ry="7" fill="#0369a1"/>
                <circle cx="41" cy="45" r="2" fill="#ffffff"/>
                <ellipse cx="60" cy="48" rx="5" ry="7" fill="#0369a1"/>
                <circle cx="59" cy="45" r="2" fill="#ffffff"/>
                <ellipse cx="50" cy="53" rx="6" ry="4" fill="#0369a1"/>
                <path d="M 42 62 Q 50 68 58 62" fill="none" stroke="#0369a1" stroke-width="2.5" stroke-linecap="round"/>
            </svg>
        </div>

        <!-- History Overlay Drawer -->
        <div class="history-drawer" id="historyDrawer">
            <div class="history-header">
                <div class="history-title">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                        <circle cx="12" cy="12" r="10"></circle>
                        <polyline points="12 6 12 12 8 14"></polyline>
                    </svg>
                    History
                </div>
                <div class="history-actions">
                    <button class="clear-btn" onclick="clearHistory()">Clear</button>
                    <button class="close-btn" onclick="toggleHistory()">✕</button>
                </div>
            </div>
            <div class="history-list" id="historyList">
                <div class="no-history">No past calculations</div>
            </div>
        </div>
    </div>

   <script>
        let currentInput = '0';
        let prevInput = '';
        let currentOperator = null;
        let isNewCalculation = false;
        let calculationPending = false;
        let calculationError = '';
        let history = JSON.parse(localStorage.getItem('stitch_calc_history') || '[]');

        const expressionEl = document.getElementById('expression');
        const resultEl = document.getElementById('result');
        const historyDrawer = document.getElementById('historyDrawer');
        const historyList = document.getElementById('historyList');

        // Render initially saved history
        renderHistory();

        // API Call para magkalkula gamit ang Node.js Gateway at Python backend
        async function performCalculation(num1, num2, operation) {
            if (calculationPending) return;
            calculationPending = true;
            setCalculatorBusy(true);
            try {
                const payload = {
                    num1: parseFloat(num1),
                    num2: parseFloat(num2),
                    operation
                };
                const response = await fetch('/api/calculate', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                let data = null;
                try {
                    data = await response.json();
                } catch {
                    data = null;
                }

                if (!response.ok) {
                    throw new Error(
                        typeof data?.error === 'string' && data.error
                            ? data.error
                            : `Calculation failed (${response.status})`
                    );
                }

                if (!Number.isFinite(data?.result)) {
                    throw new Error(
                        typeof data?.error === 'string' && data.error
                            ? data.error
                            : 'Invalid response from calculation service.'
                    );
                }

                const resultStr = String(data.result);
                const symbols = { add: '+', subtract: '-', multiply: '×', divide: '÷', power: '^', modulo: 'mod' };
                const exprStr = operation === 'square_root'
                    ? `√(${num1})`
                    : `${num1} ${symbols[operation] || ''} ${num2}`;

                addHistoryItem(exprStr, resultStr);
                currentInput = resultStr;
                prevInput = '';
                currentOperator = null;
                isNewCalculation = true;
                updateDisplay();
            } catch (err) {
                console.error('Calculation failed:', err);
                calculationError = err instanceof Error && err.message
                    ? err.message
                    : 'Calculation failed.';
                updateDisplay();
            } finally {
                calculationPending = false;
                setCalculatorBusy(false);
            }
        }

        function setCalculatorBusy(isBusy) {
            document.querySelectorAll('.keypad .btn').forEach((button) => {
                button.disabled = isBusy;
            });
        }

        function updateDisplay() {
            resultEl.innerText = currentInput;
            let opSymbol = '';
            if (currentOperator) {
                const symbols = { add: '+', subtract: '-', multiply: '×', divide: '÷', power: '^', modulo: 'mod', square_root: '√' };
                opSymbol = symbols[currentOperator] || '';
            }
            expressionEl.innerText = calculationError || (prevInput ? `${prevInput} ${opSymbol}` : '');
        }

        function appendNum(num) {
            calculationError = '';
            if (isNewCalculation) {
                currentInput = num === '.' ? '0.' : num;
                isNewCalculation = false;
            } else {
                if (num === '.' && currentInput.includes('.')) return;
                if (currentInput === '0' && num !== '.') {
                    currentInput = num;
                } else {
                    currentInput += num;
                }
            }
            updateDisplay();
        }

        function clearAll() {
            currentInput = '0';
            prevInput = '';
            currentOperator = null;
            isNewCalculation = false;
            calculationError = '';
            updateDisplay();
        }

        function deleteLast() {
            calculationError = '';
            if (isNewCalculation) {
                clearAll();
                return;
            }
            if (currentInput.length > 1) {
                currentInput = currentInput.slice(0, -1);
            } else {
                currentInput = '0';
            }
            updateDisplay();
        }

        function toggleSign() {
            calculationError = '';
            if (currentInput !== '0') {
                currentInput = (parseFloat(currentInput) * -1).toString();
                updateDisplay();
            }
        }

        async function handleOp(op) {
            if (calculationPending) return;
            calculationError = '';
            if (op === 'square_root') {
                await performCalculation(currentInput, 0, 'square_root');
                return;
            }

            if (currentOperator && !isNewCalculation) {
                await handleEquals();
                if (calculationError) return;
            }

            prevInput = currentInput;
            currentOperator = op;
            isNewCalculation = true;
            updateDisplay();
        }

        async function handleEquals() {
            if (calculationPending || !currentOperator || !prevInput) return;
            calculationError = '';
            await performCalculation(prevInput, currentInput, currentOperator);
        }

        /* History Drawer Controls */
        function toggleHistory() {
            historyDrawer.classList.toggle('open');
        }

        function addHistoryItem(expression, result) {
            const timeStr = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
            const item = { expression, result, time: timeStr };
            history.unshift(item);
            if (history.length > 30) history.pop();
            localStorage.setItem('stitch_calc_history', JSON.stringify(history));
            renderHistory();
        }

        function clearHistory() {
            history = [];
            localStorage.removeItem('stitch_calc_history');
            renderHistory();
        }

        function renderHistory() {
            if (history.length === 0) {
                historyList.innerHTML = '<div class="no-history">No past calculations</div>';
                return;
            }

            historyList.innerHTML = history.map((item, index) => `
                <div class="history-item" onclick="loadHistoryItem(${index})">
                    <div class="item-time">${item.time}</div>
                    <div class="item-expression">${item.expression} =</div>
                    <div class="item-result">${item.result}</div>
                </div>
            `).join('');
        }

        function loadHistoryItem(index) {
            if (history[index]) {
                currentInput = history[index].result;
                isNewCalculation = true;
                updateDisplay();
                toggleHistory();
            }
        }

        document.addEventListener('keydown', (event) => {
            if (event.altKey || event.ctrlKey || event.metaKey) return;
            const key = event.key;
            if (/^[0-9.]$/.test(key)) appendNum(key);
            else if (key === 'Enter' || key === '=') handleEquals();
            else if (key === 'Backspace') deleteLast();
            else if (key === 'Escape') clearAll();
            else if (key === '+') handleOp('add');
            else if (key === '-') handleOp('subtract');
            else if (key === '*') handleOp('multiply');
            else if (key === '/') handleOp('divide');
            else if (key === '%') handleOp('modulo');
            else return;
            event.preventDefault();
        });
    </script>
</body>
</html>
